name: Expo Prebuild Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild-smoke:
    name: Expo SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [56, 57]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Expo SDK ${{ matrix.sdk }} prebuild smoke
        run: pnpm run test:prebuild:expo${{ matrix.sdk }}
